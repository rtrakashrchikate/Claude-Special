  WHATSAPP FLOATING BUTTON + STICKY PHONE BAR

  1. Replace +91XXXXXXXXXX with Akash's actual WhatsApp number (no spaces/dashes)

  3. Paste the <style> block in your theme's CSS (or Additional CSS in WP Customiser)
  4. Paste the HTML just before </body> in your theme footer
  5. The sticky bar shows on mobile only; WhatsApp bubble shows on all devices
-->

<!-- ===== CSS ===== -->
<style>
/* WhatsApp Floating Button */
.wa-float {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  align-items: center;
  gap: 10px;
  background: #25D366;
  color: #fff;
  border-radius: 50px;
  padding: 12px 20px 12px 16px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  text-decoration: none;
  font-weight: 600;
  font-size: 15px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.wa-float:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  color: #fff;
}
.wa-float svg {
  width: 24px;
  height: 24px;
  fill: #fff;
  flex-shrink: 0;
}

/* Sticky Phone Bar — mobile only */
.sticky-phone-bar {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 9998;
  background: #1a237e;
  padding: 0;
}
.sticky-phone-bar .bar-inner {
  display: flex;
}
.sticky-phone-bar a {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 10px;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  text-decoration: none;
  border-right: 1px solid rgba(255,255,255,0.2);
}
.sticky-phone-bar a:last-child { border-right: none; }
.sticky-phone-bar a.wa-btn { background: #25D366; }
.sticky-phone-bar a:hover { opacity: 0.9; }
.sticky-phone-bar svg {
  width: 20px;
  height: 20px;
  fill: #fff;
  flex-shrink: 0;
}

@media (max-width: 768px) {
  .sticky-phone-bar { display: block; }
  .wa-float { bottom: 80px; } /* push above sticky bar on mobile */
}

/* Pulse animation on WhatsApp button */
@keyframes wa-pulse {
  0%   { box-shadow: 0 0 0 0 rgba(37,211,102,0.5); }
  70%  { box-shadow: 0 0 0 12px rgba(37,211,102,0); }
  100% { box-shadow: 0 0 0 0 rgba(37,211,102,0); }
}
.wa-float { animation: wa-pulse 2s infinite; }
.wa-float:hover { animation: none; }
</style>
